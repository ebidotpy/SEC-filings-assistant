name: Manual deploy

on:
  workflow_dispatch:
    inputs:
      health_url:
        description: "Public API health URL, e.g. https://your-domain/api/health"
        required: true
        type: string

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build:
    name: Build frontend
    uses: ./.github/workflows/frontend-build.yml

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://imadsaddik.com

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download frontend artifact
        uses: actions/download-artifact@v6
        with:
          name: frontend-build
          path: ./frontend/dist

      - name: Create backup (PostgreSQL)
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ secrets.HOST_IP }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -euo pipefail
            umask 077

            COMPOSE_FILE="/opt/postgres/compose.yaml"
            DB_NAME="sec-filings-assistant"
            BACKUP_DIR="/var/backups/postgresql"
            BACKUP_RETENTION_COUNT=5
            TIMESTAMP=$(date -u +%Y%m%d%H%M%S)
            BACKUP_FILE="$BACKUP_DIR/${DB_NAME}_${TIMESTAMP}.dump"

            mkdir -p "$BACKUP_DIR"

            echo "Creating PostgreSQL backup for $DB_NAME..."
            docker compose -f "$COMPOSE_FILE" exec -u postgres -T postgres \
              pg_dump -U postgres -Fc "$DB_NAME" > "$BACKUP_FILE"

            if [ ! -s "$BACKUP_FILE" ]; then
              echo "Error: Backup file is empty."
              rm -f "$BACKUP_FILE"
              exit 1
            fi

            echo "Verifying backup archive integrity..."
            docker compose -f "$COMPOSE_FILE" exec -u postgres -T postgres \
              pg_restore --list < "$BACKUP_FILE" > /dev/null

            echo "PostgreSQL backup created and verified: $BACKUP_FILE"

            echo "Cleaning old backups (keeping latest $BACKUP_RETENTION_COUNT)..."
            ls -1t "$BACKUP_DIR"/${DB_NAME}_*.dump | tail -n +$((BACKUP_RETENTION_COUNT + 1)) | xargs -r rm -f

            echo "Backup process finished successfully."

      - name: Rsync files to droplet
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_KEY }}
          REMOTE_HOST: ${{ secrets.HOST_IP }}
          REMOTE_USER: ${{ secrets.USERNAME }}
          SOURCE: "./"
          TARGET: "/web_app/"
          ARGS: "-avzr --delete --exclude-from='rsync_exclude.txt'"

      - name: Create backend .env file
        uses: appleboy/ssh-action@v1.2.4
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        with:
          host: ${{ secrets.HOST_IP }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          envs: DATABASE_URL,JWT_SECRET_KEY,OPENAI_API_KEY,POSTGRES_PASSWORD
          script: |
            set -euo pipefail
            umask 077

            echo "Creating backend .env file..."
            cat > /web_app/backend/.env <<EOF
            # --- Production Postgres ---

            # --- Local Postgres (Alembic + DB access) ---
            POSTGRES_HOST=127.0.0.1
            POSTGRES_PORT=5432
            POSTGRES_USER=backend
            POSTGRES_PASSWORD=$POSTGRES_PASSWORD
            POSTGRES_DB=sec-filings-assistant

            DATABASE_URL=$DATABASE_URL

            # --- JWT Auth ---
            JWT_SECRET_KEY=$JWT_SECRET_KEY
            JWT_ALGORITHM=HS256
            JWT_ACCESS_TOKEN_EXPIRE_MINUTES=10080

            # --- OpenAI / LLM ---
            OPENAI_API_KEY=$OPENAI_API_KEY
            BASE_URL=https://api.avalai.ir/v1
            OPENAI_EMBEDDING_MODEL=text-embedding-3-small
            OPENAI_EMBEDDING_DIMENSIONS=1536
            OPENAI_EMBEDDING_MAX_CHUNK_TOKENS=512
            OPENAI_CHAT_MODEL=gpt-5-mini


            # --- Server ---
            ALLOWED_ORIGINS=http://localhost:5173

            # --- Logging (structlog) ---
            LOG_LEVEL=INFO
            LOG_JSON=false

            # --- Agent (LLM orchestration) ---
            AGENT_TEMPERATURE=0.2
            AGENT_REASONING_EFFORT=low
            AGENT_MAX_REQUESTS=20
            AGENT_MAX_TOOL_CALLS=30
            AGENT_OUTPUT_RETRIES=2

            # --- Retrieval (hybrid search tuning) ---
            RETRIEVAL_CANDIDATE_K=50
            RETRIEVAL_TOP_K=10
            RETRIEVAL_RRF_K=60
            RETRIEVAL_NEIGHBOR_RADIUS=1
            RETRIEVAL_SEMANTIC_MIN_SIMILARITY=0.0
            RETRIEVAL_KEYWORD_MODEL=gpt-5-nano
            RETRIEVAL_KEYWORD_TEMPERATURE=0.0

            ENVIRONMENT=production
            EOF

            chmod 600 /web_app/backend/.env
            echo "Backend .env file created successfully."

      - name: Install Python dependencies (uv with rollback)
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ secrets.HOST_IP }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -euo pipefail
            export PATH="$HOME/.local/bin:$PATH"

            BACKEND_DIR="/web_app/backend"
            cd "$BACKEND_DIR"

            echo "Backing up current .venv..."
            rm -rf .venv_backup
            if [ -d ".venv" ]; then
              mv .venv .venv_backup
              echo "Current .venv backed up to .venv_backup."
            fi

            echo "Syncing Python dependencies with uv..."
            if uv sync --frozen --no-dev; then
              echo "Python dependencies installed successfully."
            else
              echo "Error: Failed to install Python dependencies."
              echo "Rolling back to previous .venv..."
              rm -rf .venv
              if [ -d ".venv_backup" ]; then
                mv .venv_backup .venv
                echo "Rollback complete."
              fi
              exit 1
            fi

            # Clean up backup after successful sync
            if [ -d ".venv_backup" ]; then
              rm -rf .venv_backup
              echo "Cleaned up .venv_backup."
            fi

            echo "Virtual environment setup completed successfully."

      - name: Apply database migrations
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ secrets.HOST_IP }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -euo pipefail
            export PATH="$HOME/.local/bin:$PATH"
            cd /web_app/backend
            uv run --frozen --no-dev alembic upgrade head

      - name: Restart backend service
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ secrets.HOST_IP }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e

            echo "Restarting FastAPI backend service..."
            if sudo supervisorctl restart all; then
              echo "FastAPI backend restarted successfully."
            else
              echo "Error: Failed to restart FastAPI backend."
              exit 1
            fi

            # Verify the service is running
            sleep 5
            if sudo supervisorctl status all | grep -q "RUNNING"; then
              echo "FastAPI backend is running."
            else
              echo "Error: FastAPI backend failed to start properly."
              sudo supervisorctl status all
              exit 1
            fi

      - name: Reload Nginx
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ secrets.HOST_IP }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e

            echo "Testing Nginx configuration..."
            if sudo nginx -t; then
              echo "Nginx configuration is valid."
            else
              echo "Error: Nginx configuration test failed."
              exit 1
            fi

            echo "Reloading Nginx..."
            if sudo nginx -t; then
              echo "Configuration OK. Reloading Nginx..."
              sudo systemctl reload nginx
            else
              echo "Nginx configuration test failed! Not reloading."
              exit 1
            fi

            echo "Deployment complete!"

      - name: Verify deployed API
        env:
          DEPLOY_HEALTH_URL: ${{ inputs.health_url }}
        run: |
          curl --fail --silent --show-error --retry 5 --retry-connrefused \
            --retry-delay 2 --max-time 10 "$DEPLOY_HEALTH_URL"
