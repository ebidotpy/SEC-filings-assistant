name: DAST API scan

on:
  workflow_call:


env:
  POSTGRES_USER: "test_user"
  POSTGRES_PASSWORD: "aStrongPasswordForTesting"
  POSTGRES_DB: "backend_test_db"
  POSTGRES_HOST: "localhost"
  POSTGRES_PORT: "5432"
  DATABASE_URL: "postgresql://test_user:aStrongPasswordForTesting@localhost:5432/backend_test_db"
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

defaults:
  run:
    working-directory: ./backend
jobs:
  tests:
    name: Run E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          # Must be hardcoded here; ${{ env... }} does not work inside 'services'
          POSTGRES_USER: "test_user"
          POSTGRES_PASSWORD: "aStrongPasswordForTesting"
          POSTGRES_DB: "backend_test_db"
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test_user -d backend_test_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv and set up Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: |
            backend/uv.lock
            backend/pyproject.toml
      - name: Verify uv installation
        run: uv --version

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run database migrations
        run: uv run alembic upgrade head
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Start backend server
        run: |
          uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          echo "Waiting for backend to start..."
          for i in {1..30}; do
            if curl -s http://localhost:8000/api/health | grep -q
              echo "Backend is ready!"
              break
            fi 
            echo "Attempt $i: Backend not ready yet..."
            sleep 1
          done
          if ! curl -s http://localhost:8000/api/health | grep -q
            echo "Backend failed to start after 30 attemps"
            exit 1
          fi
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
        
      - name: Seed E2E test data
        run: python -m tests.test_data
        env: 
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: ZAP API scan
        uses: zaproxy/action-api-scan@v0.10.0
        with: 
          target: "http://localhost:8000/openapi.json"
          format: openapi
          rules_file_name: ".github/zap-rules.tsv"
          allow_issue_writing: false
          fail_action: true