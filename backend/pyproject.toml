[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "document-copilot-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.18.4",
    "fastapi==0.138.0",
    "httpx==0.28.1",
    "logfire[system-metrics]==4.37.0",
    "openai==2.43.0",
    "pgvector==0.4.2",
    "psycopg[binary]==3.3.4",
    "pydantic==2.13.4",
    "pydantic-ai-slim[openai]==2.3.0",
    "pydantic-settings==2.14.2",
    "sqlalchemy==2.0.51",
    "structlog==26.1.0",
    "bcrypt>=4.0.0",
    "pyjwt>=2.8.0",
    "tiktoken==0.12.0",
    "uvicorn==0.49.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
add-bounds = "exact"
exclude-newer = "7 days"

[dependency-groups]
dev = [
    "docling==2.107.0",
    "ipykernel==7.3.0",
    "pre-commit==4.7.0",
    "pytest==9.1.1",
    "ruff==0.15.18",
]

[tool.pytest.ini_options]
markers = [
    "integration: tests that require live OpenAI or Supabase credentials",
]
