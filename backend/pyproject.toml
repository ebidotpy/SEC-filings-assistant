[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "document-copilot-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
 "alembic==1.20.1",
 "bcrypt==5.0.0",
 "fastapi==0.162.2",
 "httpx==0.28.1",
 "logfire[system-metrics]==5.5.0",
 "openai==3.46.0",
 "pgvector==0.5.1",
 "psycopg[binary]==3.3.8",
 "pydantic==2.14.3",
 "pydantic-ai-slim[openai]==2.66.0",
 "pydantic-settings==2.16.2",
 "pyjwt==2.15.1",
 "sqlalchemy==2.1.8",
 "structlog==26.1.0",
 "tiktoken==0.14.0",
 "uvicorn==0.54.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
add-bounds = "exact"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
# exclude-newer = "7 days"

[dependency-groups]
dev = [
    "docling==2.149.0",
    "ipykernel==7.4.0",
    "pre-commit==4.7.0",
    "pytest==9.2.0",
    "ruff==0.17.4",
]

[tool.pytest.ini_options]
markers = [
    "integration: tests that require live OpenAI or Supabase credentials",
]
